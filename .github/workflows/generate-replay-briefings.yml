name: Generate replay briefings

# One-off: writes AI briefings for every key moment of the wildfire replays with a free model on OpenRouter
# and commits them to data/scenarios/<fireId>/briefings.json on the branch it ran on. The refresh workflow
# then uses those saved briefings as they are, so the replays never need a live AI call.
# Review the saved text and set "reviewed": true on the drafts a person has checked.
#
# Runs when this file changes on the branch below, or by hand (Actions > Generate replay briefings > Run).
# Moments already saved are skipped, so a second run only retries the missing ones.
# It never deploys the site and never pushes to main.
on:
  push:
    branches: [feature/ollama-briefings]
    paths: [".github/workflows/generate-replay-briefings.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-replay-briefings
  cancel-in-progress: false

jobs:
  generate:
    name: Write and save the replay briefings
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      BRIEFING_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      # 18 moments, a second try for a rejected answer: about 20-36 requests of the ~50 free per day.
      - name: Write the replay briefings
        run: python data/build_briefings.py --only replay --max-calls 36 --time-budget 1200

      - name: Save the accepted AI drafts
        run: python data/pin_replay_briefings.py --file data/pipeline/live/briefings.json

      # Public annotations: the result can be read on the run page (and through the API) without the log.
      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          p = pathlib.Path("data/pipeline/live/briefings.json")
          if not p.exists():
              print("::error::No briefings were written")
              raise SystemExit
          d = json.loads(p.read_text(encoding="utf-8"))
          rep = [b for b in d["briefings"] if b["kind"] == "replay"]
          ai = [b for b in rep if b["model"] != "template"]
          print(f"::notice::Replay briefings: {len(ai)} AI ({sum(bool(b.get('pinned')) for b in rep)} already saved), "
                f"{len(rep) - len(ai)} template, {d['counts']['calls']} model calls")
          for b in rep:
              if b.get("aiRejected"):
                  print(f"::warning::{b['key']} rejected: {'; '.join(b['aiRejected'])[:300]}")
          EOF

      - name: Commit the saved briefings to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scenarios/*/briefings.json
          if git diff --cached --quiet; then
            echo "::notice::No new AI draft was accepted, nothing to save"
            exit 0
          fi
          git commit -m "Save replay AI briefings (free model via OpenRouter, generated in Actions)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
