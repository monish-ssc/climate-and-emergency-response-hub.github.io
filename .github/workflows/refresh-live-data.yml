name: Refresh live hazard data

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub Actions scheduling delays.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-live-hazard-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Build and validate hazard snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Calculate reference-data cache key
        id: reference_cache_key
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore flood baselines and hurricane history
        uses: actions/cache@v5
        with:
          path: |
            data/pipeline/baselines.json
            data/raw/ibtracs/ibtracs.last3years.list.v04r01.csv
          key: live-reference-${{ runner.os }}-${{ steps.reference_cache_key.outputs.week }}
          restore-keys: |
            live-reference-${{ runner.os }}-

      - name: Install pipeline dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Refresh wildfire data
        run: python data/wildfire_pipeline.py

      - name: Refresh flood data
        run: python data/flood_pipeline.py

      - name: Refresh hurricane and severe-storm data
        run: python data/hurricane_pipeline.py

      - name: Rebuild risk index
        run: python data/build_risk_index.py

      - name: Validate refreshed outputs
        run: python data/validate_live_outputs.py

      - name: Upload refreshed data artifact
        uses: actions/upload-artifact@v7
        with:
          name: live-hazard-data-${{ github.run_id }}
          path: |
            data/pipeline
            !data/pipeline/baselines.json
            data/samples/*_severe_storm.json
          if-no-files-found: error
          retention-days: 2

